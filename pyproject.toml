[project]
name = "rapsheet"
version = "0.1.0"
description = "Calibrated, abstaining classification of charge text from one county's public dispositions table — a reference implementation of a methodology, not a screening tool."
authors = [{ name = "Steven Miers", email = "steven.miers@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13.16,<3.14"
dependencies = [
    "modgud (>=1.3.0,<2.0.0)",
    "nbformat (>=5.11.1)",
    "numpy (>=1.26)",
    "pandas (>=2.2,<4.0)",
    "pyarrow (>=17.0)",
    "requests (>=2.32,<3.0)",
    "playwright (>=1.64.0)",
    "pyyaml (>=6.0,<7.0)",
    "scikit-learn (>=1.5,<2.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "huggingface-hub (>=2.2.0,<3.0.0)",
]

[project.scripts]
rapsheet-pull = "rapsheet.cli:PullCommand.main"
rapsheet-publish = "rapsheet.cli:PublishCommand.main"

[tool.poetry]
packages = [{ include = "rapsheet" }]

[tool.poetry.requires-plugins]
poetry-dotenv-plugin = ">=0.2"

[dependency-groups]
train = [
    "torch (>=2.4)",
    "transformers (>=4.44)",
    "matplotlib (>=3.9)",
]
test = [
    "pytest (>=8.4,<9.0)",
    "ruff (>=0.14,<1.0)",
]
dev = [
    { include-group = "train" },
    { include-group = "test" },
    "jupyter (>=1.1)",
    "ipykernel (>=6.29)",
]

[tool.pytest.ini_options]
cache_dir = "tmp/.pytest_cache"
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
